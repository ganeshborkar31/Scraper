[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-discovery"
version = "0.1.0"
description = "Policy-aware public business data discovery MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3", "jinja2>=3.1,<4", "python-multipart>=0.0.9",
  "itsdangerous>=2.2,<3", "passlib[bcrypt]>=1.7.4,<2", "celery[redis]>=5.4,<6", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "email-validator>=2.2,<3", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S112"]
